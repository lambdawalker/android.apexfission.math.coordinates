<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Center crop coordinate mapping</title><desc id="desc">Source 1920 by 1080. Crop offset 420, zero. Source box 500,100 to 1000,600 becomes 80,100 to 580,600.</desc><rect width="960" height="600" rx="20" fill="#101d2b"/><g font-family="sans-serif" fill="#edf4ff"><text x="36" y="44" font-size="24">One box. Two coordinate frames.</text><text x="36" y="82" font-size="17">Source: 1920 × 1080 · centered crop: 1080 × 1080</text></g><g transform="translate(36 110) scale(.45)"><rect width="1920" height="1080" fill="#172b40" stroke="#7590ad" stroke-width="4"/><rect x="420" width="1080" height="1080" fill="#164743" stroke="#5ee4c5" stroke-width="6"/><rect x="500" y="100" width="500" height="500" fill="#b0e7e0" fill-opacity=".25" stroke="#ffcf80" stroke-width="6"/></g><g font-family="sans-serif" font-size="17" fill="#edf4ff"><text x="275" y="180">Source (500, 100)</text><text x="275" y="210">Crop (80, 100)</text><text x="275" y="345">500 × 500 box</text><text x="235" y="565">Crop starts at source x = 420</text></g></svg>
