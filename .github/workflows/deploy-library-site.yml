name: Coordinates documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: [Publish coordinates library, Finalize coordinates release, Build selected library on JitPack]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: coordinates-docs-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  build:
    if: (github.event_name != 'workflow_run' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')) || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name != 'pull_request' && 'main' || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned documentation tool
        run: cargo install --locked --git https://github.com/lambdawalker/gradle.android-repo-setup.git --tag v0.1.16 android-repo-docs
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install publication tooling dependencies
        run: python -m pip install -r scripts/requirements-publishing.txt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Verify executable documentation
        run: ./gradlew test runExamples verifyImportDocs --no-daemon
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sites/package-lock.json
      - name: Build and validate both documentation audiences
        working-directory: sites
        run: |
          npm ci
          cd ..
          android-repo-docs build --check
      - name: Reject stale deployment source
        if: github.event_name != 'pull_request'
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: sites/dist
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
