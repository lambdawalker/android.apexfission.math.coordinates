name: Coordinates documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: [Publish coordinates library]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: coordinates-docs-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify executable documentation
        run: ./gradlew test runExamples verifyImportDocs --no-daemon
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sites/package-lock.json
      - name: Build and validate both documentation audiences
        working-directory: sites
        run: |
          npm ci
          node scripts/sync-docs.mjs --check
          npm run check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sites/dist
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
