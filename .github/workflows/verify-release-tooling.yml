name: Verify release tooling (no publication)

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r scripts/requirements-publishing.txt
      - name: Test release policy and deterministic documentation
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/module_release.py verify
          python3 scripts/publishing_config.py check
          python3 scripts/documentation_history.py verify
          bash -n scripts/finalize-release.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify Gradle build and local publication without credentials
        run: |
          ./gradlew generateImportDocs verifyImportDocs test runExamples build publishAllPublicationsToVerificationRepository -PreleaseVersion=9.8.7 --no-daemon
          git diff --exit-code -- IMPORT.md docs/release.json
          python3 scripts/module_release.py check-local --module coordinates --version 9.8.7 --source "$(git rev-parse HEAD)"
      - name: Verify unsigned public JitPack publication locally
        env:
          RELEASE_REPOSITORY: jitpack
        run: |
          ./gradlew publishAllPublicationsToVerificationRepository -PjitpackBuild=true -PreleaseVersion=9.8.7 --no-daemon
          python3 scripts/module_release.py check-local --module coordinates --version 9.8.7 --source "$(git rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check the documentation site
        working-directory: sites
        run: |
          npm ci
          npm run check
